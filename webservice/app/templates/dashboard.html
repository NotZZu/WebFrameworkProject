<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대시보드 — 자동화 검증시스템</title>
<style>
:root{--navy:#1e2761;--accent:#3d5afe;--bg:#f4f6fa;--muted:#6b7488;--line:#dfe3ee;--warn:#d93025;--warnbg:#fdecea}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--navy);background:var(--bg);min-height:100vh;display:grid;grid-template-columns:240px 1fr}
aside{background:linear-gradient(180deg,#1e2761,#141a47);color:#c9cfee;padding:24px 16px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;margin:0 8px 28px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-style:normal}
nav a{display:block;padding:11px 12px;border-radius:9px;margin-bottom:4px;font-size:14px;color:#c9cfee;text-decoration:none}
nav a.on{background:#2b3580;color:#fff;font-weight:700}
nav a.soon{opacity:.45;cursor:not-allowed}
.chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;background:#2b3580;border-radius:10px;color:#fff;font-size:13px}
.chip b{display:block}.chip small{color:#c9cfee}
main{padding:32px 40px;max-width:1100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:14px;margin-top:4px}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;opacity:.5;cursor:not-allowed}
.logout{background:none;border:1px solid var(--line);color:var(--navy);border-radius:8px;padding:8px 14px;font-size:13px;margin-left:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(30,39,97,.06)}
.kpi span{font-size:13px;color:var(--muted)}.kpi strong{display:block;font-size:32px;margin-top:8px}
.kpi.danger strong.alert{color:var(--warn)}
.kpi.danger.hot{background:var(--warnbg)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(30,39,97,.06)}
.panel h2{margin:0 0 14px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid #eef0f6}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.s-submitted{background:#eef0f6;color:#6b7488}.s-reviewing{background:#e3e9ff;color:var(--accent)}
.s-approved{background:#e6f4ea;color:#137333}.s-rejected{background:var(--warnbg);color:var(--warn)}
#recent-empty,.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
#notifications{list-style:none;margin:0;padding:0}
#notifications li{padding:10px 12px;border-radius:10px;background:#f4f6fa;margin-bottom:8px;font-size:13px;line-height:1.5}
#notifications li.warning{background:var(--warnbg);color:var(--warn);font-weight:700}
@media(max-width:900px){body{grid-template-columns:1fr}aside{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div class="logo"><i>A</i> 자동화 검증시스템</div>
  <nav>
    <a class="on" href="/dashboard">대시보드</a>
    <a class="soon" title="준비 중">가명·익명정보 처리</a>
    <a class="soon" title="준비 중">CAVP 시험 신청</a>
    <a class="soon" title="준비 중">검증서 이력 조회</a>
    <a class="soon" title="준비 중">위변조 탐지 결과</a>
  </nav>
  <div class="chip"><div><b>{{ user.username }}</b><small>{{ {"individual":"개인","company":"기업","institution":"기관"}[user.user_type] }} 사용자</small></div></div>
</aside>
<main>
  <header>
    <div>
      <h1 id="welcome">안녕하세요, {{ user.username }}님</h1>
      <div class="sub" id="scope-note">오늘의 시험 현황을 확인하세요.</div>
    </div>
    <div><button class="btn" id="new-app" disabled title="준비 중">+ CAVP 시험 신청</button><button class="logout" id="logout">로그아웃</button></div>
  </header>
  <section class="kpis">
    <div class="kpi"><span>진행중 시험</span><strong id="kpi-in-progress">–</strong></div>
    <div class="kpi"><span>발급 검증서</span><strong id="kpi-certificates">–</strong></div>
    <div class="kpi danger" id="kpi-suspected-card"><span>위변조 의심 건</span><strong id="kpi-suspected">–</strong></div>
    <div class="kpi"><span>가명처리</span><strong id="kpi-privacy">–</strong></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>최근 CAVP 시험 신청</h2>
      <table><thead><tr><th>번호</th><th>알고리즘</th><th>신청일</th><th>상태</th></tr></thead><tbody id="recent-body"></tbody></table>
    </div>
    <div class="panel"><h2>알림</h2><ul id="notifications"></ul></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load() {
  const r = await fetch("/api/dashboard");
  if (r.status === 401) { location.href = "/"; return; }
  const d = await r.json();
  $("kpi-in-progress").textContent = d.applications.in_progress;
  $("kpi-certificates").textContent = d.certificates.total;
  $("kpi-suspected").textContent = d.certificates.suspected;
  $("kpi-privacy").textContent = d.privacy.processed ? 1 : 0;
  if (d.certificates.suspected > 0) { $("kpi-suspected").classList.add("alert"); $("kpi-suspected-card").classList.add("hot"); }
  if (d.scope === "all") $("scope-note").textContent = "기관 계정: 전체 신청·검증서 현황입니다.";
  const rows = d.recent_applications;
  $("recent-body").innerHTML = rows.length ? rows.map(a =>
    `<tr><td>#${a.id}</td><td>${esc(a.algorithm_type)}</td><td>${a.submitted_at}</td>` +
    `<td><span class="badge s-${a.status}">${esc(a.status_label)}</span></td></tr>`).join("")
    : `<tr><td colspan="4" id="recent-empty">아직 신청 내역이 없습니다.</td></tr>`;
  $("notifications").innerHTML = d.notifications.length
    ? d.notifications.map(n => `<li class="${n.type}">${esc(n.message)}</li>`).join("")
    : `<li class="empty">새 알림이 없습니다.</li>`;
}
$("logout").onclick = async () => { await fetch("/api/auth/logout", {method: "POST"}); location.href = "/"; };
load();
</script>
</body>
</html>
