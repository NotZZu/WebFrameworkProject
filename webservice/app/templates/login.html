<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 — 자동화 검증시스템</title>
<link rel="stylesheet" href="/static/krds/resources/css/common/common.css">
<link rel="stylesheet" href="/static/krds/resources/css/component/component.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="ui-1">
<a class="skip" href="#main">본문 바로가기</a>
<header class="app-header"><div class="inner"><a class="logo" href="/"><i>A</i> 자동화 검증시스템</a></div></header>
<div class="login-wrap">
<section class="login-hero">
  <div class="logo"><i>A</i> 자동화 검증시스템</div>
  <div><h1>암호모듈 시험·검증<br>온라인 서비스</h1>
  <p>CAVP 시험 신청부터 검증서 이력 조회, 위변조 탐지까지 한곳에서 관리하세요.</p></div>
  <ul><li><b>✓</b>가명·익명 정보 처리로 개인정보 보호 강화</li><li><b>✓</b>CAVP 시험 진행 상태 실시간 조회</li><li><b>✓</b>검증서 위변조 자동 탐지</li></ul>
</section>
<main class="login-main" id="main">
<form class="login-card" id="form" novalidate>
  <h2 id="title">로그인</h2>
  <p class="sub" id="sub">사용자 유형을 선택하고 로그인하세요</p>
  <div class="tabs" id="tabs" role="group" aria-label="사용자 유형">
    <button type="button" data-type="individual" aria-pressed="true">개인</button>
    <button type="button" data-type="company" aria-pressed="false">기업</button>
    <button type="button" data-type="institution" aria-pressed="false">기관</button>
  </div>
  <div class="form-group"><label for="username">아이디</label>
  <input class="krds-input" id="username" name="username" autocomplete="username" placeholder="영문·숫자·밑줄 4~20자" maxlength="20"></div>
  <div class="form-group"><label for="password">비밀번호</label>
  <input class="krds-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" maxlength="64">
  <div class="hint" id="pwhint" hidden>8~64자, 영문과 숫자를 각각 1자 이상 포함</div></div>
  <div id="signup-only" hidden>
    <div class="form-group"><label for="password2">비밀번호 확인</label>
    <input class="krds-input" id="password2" type="password" autocomplete="new-password" maxlength="64"></div>
    <div id="org-wrap" class="form-group" hidden><label for="org_code">기관 코드</label><input class="krds-input" id="org_code" name="org_code" maxlength="50" placeholder="소속 기관 코드"></div>
  </div>
  <div class="err" id="msg" role="alert" aria-live="polite"></div>
  <button class="krds-btn large primary" id="submit" type="submit">로그인</button>
  <div class="switch"><span id="switch-text">계정이 없으신가요?</span><a id="switch" role="button" tabindex="0">회원가입</a></div>
</form>
</main>
</div>
{% include "_footer.html" %}
<script src="/static/js/login.js" defer></script>
</body></html>
