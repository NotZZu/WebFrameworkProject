<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대시보드 — 자동화 검증시스템</title>
<style>body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#f4f6fa;margin:0;display:grid;place-items:center;min-height:100vh;color:#1e2761}
.card{background:#fff;padding:40px 48px;border-radius:16px;box-shadow:0 8px 30px rgba(30,39,97,.1);text-align:center}
button{margin-top:20px;background:#3d5afe;color:#fff;border:0;border-radius:10px;padding:10px 24px;font-size:15px;cursor:pointer}</style></head>
<body><div class="card"><h1 id="welcome">{{ user.username }} 님 환영합니다</h1>
<p>사용자 유형: <b>{{ {"individual":"개인","company":"기업","institution":"기관"}[user.user_type] }}</b></p>
<p style="color:#6b7488">SC-02 대시보드는 다음 단계에서 구현됩니다.</p>
<button id="logout">로그아웃</button></div>
<script>document.getElementById("logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/"}</script></body></html>
