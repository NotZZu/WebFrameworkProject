{% extends "_layout.html" %}
{% set active = 'apply' %}
{% block title %}CAVP 시험 신청{% endblock %}
{% block head %}
<div><h1>CAVP 시험 신청</h1><div class="sub">시험을 받을 암호 알고리즘을 선택해 신청하세요. 같은 알고리즘은 진행 중에는 다시 신청할 수 없습니다.</div></div>
{% endblock %}
{% block content %}
  <section class="form-grid">
    <div class="panel"><h2>신청서</h2>
      <label for="algorithm">시험 대상 알고리즘</label>
      <select class="krds-form-select" id="algorithm"><option value="">알고리즘을 선택하세요</option></select>
      <p style="margin:16px 0 0"><button class="krds-btn medium primary" id="submit-app" type="button">시험 신청</button></p>
      <div id="apply-msg" role="status" aria-live="polite"></div>
    </div>
    <div class="panel"><h2>내 신청 목록</h2>
      <div class="krds-table-wrap"><table class="tbl data"><thead><tr><th>번호</th><th>알고리즘</th><th>신청일시</th><th>상태</th></tr></thead><tbody id="my-apps-body"></tbody></table></div>
    </div>
  </section>
{% endblock %}
{% block scripts %}
<script src="/static/js/cavp_apply.js" defer></script>
{% endblock %}
