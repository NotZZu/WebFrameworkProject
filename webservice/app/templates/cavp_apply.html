<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAVP 시험 신청 — 자동화 검증시스템</title>
<style>
:root{--navy:#1e2761;--accent:#3d5afe;--bg:#f4f6fa;--muted:#6b7488;--line:#dfe3ee;--warn:#d93025;--warnbg:#fdecea}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--navy);background:var(--bg);min-height:100vh;display:grid;grid-template-columns:240px 1fr}
aside{background:linear-gradient(180deg,#1e2761,#141a47);color:#c9cfee;padding:24px 16px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;margin:0 8px 28px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-style:normal}
nav a{display:block;padding:11px 12px;border-radius:9px;margin-bottom:4px;font-size:14px;color:#c9cfee;text-decoration:none}
nav a.on{background:#2b3580;color:#fff;font-weight:700}
nav a.soon{opacity:.45;cursor:not-allowed}
.chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;background:#2b3580;border-radius:10px;color:#fff;font-size:13px}
.chip b{display:block}.chip small{color:#c9cfee}
main{padding:32px 40px;max-width:1100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:14px;margin-top:4px}
button{font-family:inherit;cursor:pointer}

.logout{background:none;border:1px solid var(--line);color:var(--navy);border-radius:8px;padding:8px 14px;font-size:13px;margin-left:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(30,39,97,.06)}
.kpi span{font-size:13px;color:var(--muted)}.kpi strong{display:block;font-size:32px;margin-top:8px}
.kpi.danger strong.alert{color:var(--warn)}
.kpi.danger.hot{background:var(--warnbg)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(30,39,97,.06)}
.panel h2{margin:0 0 14px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid #eef0f6}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.s-submitted{background:#eef0f6;color:#6b7488}.s-reviewing{background:#e3e9ff;color:var(--accent)}
.s-approved{background:#e6f4ea;color:#137333}.s-rejected{background:var(--warnbg);color:var(--warn)}
#recent-empty,.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
#notifications{list-style:none;margin:0;padding:0}
#notifications li{padding:10px 12px;border-radius:10px;background:#f4f6fa;margin-bottom:8px;font-size:13px;line-height:1.5}
#notifications li.warning{background:var(--warnbg);color:var(--warn);font-weight:700}
@media(max-width:900px){body{grid-template-columns:1fr}aside{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}

.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--navy);background:#fff}
#apply-msg{min-height:22px;margin:12px 0 0;font-size:14px}
#apply-msg.ok{color:#137333}#apply-msg.err{color:var(--warn)}
.form-grid{display:grid;grid-template-columns:1fr 2fr;gap:16px}
@media(max-width:900px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div class="logo"><i>A</i> 자동화 검증시스템</div>
  <nav>
    <a href="/dashboard">대시보드</a>
    <a href="/privacy">가명·익명정보 처리</a>
    <a class="on" href="/cavp/apply">CAVP 시험 신청</a>
    <a href="/cavp/status">CAVP 진행상태</a>
    <a class="soon" title="준비 중">검증서 이력 조회</a>
    <a class="soon" title="준비 중">위변조 탐지 결과</a>
  </nav>
  <div class="chip"><div><b>{{ user.username }}</b><small>{{ {"individual":"개인","company":"기업","institution":"기관"}[user.user_type] }} 사용자</small></div></div>
</aside>
<main>
  <header>
    <div>
      <h1>CAVP 시험 신청</h1>
      <div class="sub">시험을 받을 암호 알고리즘을 선택해 신청하세요. 같은 알고리즘은 진행 중에는 다시 신청할 수 없습니다.</div>
    </div>
    <div><button class="logout" id="logout">로그아웃</button></div>
  </header>
  <section class="form-grid">
    <div class="panel"><h2>신청서</h2>
      <label for="algorithm">시험 대상 알고리즘</label>
      <select id="algorithm"><option value="">알고리즘을 선택하세요</option></select>
      <p style="margin:16px 0 0"><button class="btn" id="submit-app" type="button">시험 신청</button></p>
      <div id="apply-msg" role="status" aria-live="polite"></div>
    </div>
    <div class="panel"><h2>내 신청 목록</h2>
      <table><thead><tr><th>번호</th><th>알고리즘</th><th>신청일시</th><th>상태</th></tr></thead><tbody id="my-apps-body"></tbody></table>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function say(text, kind) { const m = $("apply-msg"); m.textContent = text; m.className = kind; }
async function api(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = "/"; throw new Error("auth"); }
  return r;
}
async function loadAlgorithms() {
  const d = await (await api("/api/cavp/algorithms")).json();
  $("algorithm").innerHTML += d.algorithms.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
}
async function loadList() {
  const d = await (await api("/api/cavp/applications?per_page=50")).json();
  $("my-apps-body").innerHTML = d.items.length ? d.items.map(a =>
    `<tr><td>#${a.id}</td><td>${esc(a.algorithm_type)}</td><td>${esc(a.submitted_at)}</td>` +
    `<td><span class="badge s-${a.status}">${esc(a.status_label)}</span></td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">아직 신청 내역이 없습니다.</td></tr>`;
}
$("submit-app").onclick = async () => {
  const algo = $("algorithm").value;
  if (!algo) return say("시험 대상 알고리즘을 선택해 주세요.", "err");
  $("submit-app").disabled = true;
  try {
    const r = await api("/api/cavp/applications", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({algorithm_type: algo})});
    const d = await r.json();
    if (r.status === 201) { say(`${algo} 시험 신청이 접수되었습니다. (신청 번호 #${d.id})`, "ok"); await loadList(); }
    else if (r.status === 409) say("같은 알고리즘의 진행 중인 신청이 있습니다. 완료된 뒤 다시 신청해 주세요.", "err");
    else say((d.error && d.error.message) || "신청하지 못했습니다. 잠시 후 다시 시도해 주세요.", "err");
  } catch (e) { if (e.message !== "auth") say("네트워크 오류가 발생했습니다.", "err"); }
  finally { $("submit-app").disabled = false; }
};
$("logout").onclick = async () => { await fetch("/api/auth/logout", {method: "POST"}); location.href = "/"; };
loadAlgorithms(); loadList();
</script>
</body>
</html>
