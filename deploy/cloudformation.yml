AWSTemplateFormatVersion: "2010-09-09"
Description: 자동화 검증시스템 - 웹 서비스(80)와 시험 시연 페이지(8080)를 EC2 한 대에 Docker 로 호스팅 (프리티어 우선)

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]
    Description: 프리티어 대상 인스턴스(t3.micro 또는 t2.micro). 메모리가 모자라면 t3.small
  RepoUrl:
    Type: String
    Default: https://github.com/NotZZu/WebFrameworkProject.git
    Description: 배포할 GitHub 저장소 (main 브랜치를 3분마다 확인해 자동 배포)
  AlertEmail:
    Type: String
    Default: shlee21016@gmail.com
    Description: 요금 예산 경고를 받을 이메일
  MonthlyBudgetUsd:
    Type: Number
    Default: 1
    Description: 월 예산(USD). 실제 비용이 100%에 이르면 서버(EC2)를 자동 정지
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP 80 (service) and 8080 (test demo). SSH is closed; use SSM
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: web service }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 0.0.0.0/0, Description: test demo }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt AppSecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: verification-system }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y git
          git clone --depth 50 ${RepoUrl} /opt/app/repo
          SERVICE_IP=${ElasticIp} REPO_URL=${RepoUrl} bash /opt/app/repo/deploy/bootstrap.sh

  IpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref AppInstance

  # ---- HTTPS: CloudFront 가 https://*.cloudfront.net 인증서를 제공하고 EC2 로 전달 ----
  ServiceCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: verification-system service (HTTPS)
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: app
            DomainName: !Sub
              - ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com
              - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
            CustomOriginConfig: { OriginProtocolPolicy: http-only, HTTPPort: 80, OriginReadTimeout: 60 }
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          Compress: true

  DemoCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: verification-system test demo (HTTPS)
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: demo
            DomainName: !Sub
              - ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com
              - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
            CustomOriginConfig: { OriginProtocolPolicy: http-only, HTTPPort: 8080, OriginReadTimeout: 60 }
        DefaultCacheBehavior:
          TargetOriginId: demo
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          Compress: true

  # ---- 요금 방어: 예산 알림 + 초과 시 EC2 자동 정지 ----
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: verification-system-budget
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: budgets.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: stop-ec2
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: ["ec2:DescribeInstanceStatus", "ec2:DescribeInstances"], Resource: "*" }
              - { Effect: Allow, Action: ["ec2:StopInstances"], Resource: "*", Condition: { StringEquals: { "aws:ResourceTag/Name": verification-system } } }
              - { Effect: Allow, Action: ["ssm:StartAutomationExecution"], Resource: "*" }

  BudgetStopAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: !Ref CostBudget
      NotificationType: ACTUAL
      ActionType: RUN_SSM_DOCUMENTS
      ActionThreshold: { Type: PERCENTAGE, Value: 100 }
      ExecutionRoleArn: !GetAtt BudgetActionRole.Arn
      ApprovalModel: AUTOMATIC
      Definition:
        SsmActionDefinition:
          Subtype: STOP_EC2_INSTANCES
          Region: !Ref AWS::Region
          InstanceIds: [!Ref AppInstance]
      Subscribers: [{ Type: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  ServiceUrl:
    Description: 웹 서비스 주소 (HTTPS)
    Value: !Sub https://${ServiceCdn.DomainName}
  DemoUrl:
    Description: 시험 시연 페이지 주소 (HTTPS)
    Value: !Sub https://${DemoCdn.DomainName}
  ServiceUrlHttp:
    Value: !Sub http://${ElasticIp}
  DemoUrlHttp:
    Value: !Sub http://${ElasticIp}:8080
  InstanceId:
    Value: !Ref AppInstance
